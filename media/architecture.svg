<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600"
     height="1100"
     viewBox="0 0 1600 1100"
     font-family="Roboto Condensed, Helvetica Neue, Arial, sans-serif">

  <defs>

    <!-- ========================================================= -->
    <!-- FILTER                                                     -->
    <!-- ========================================================= -->

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2"
                    flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>


    <!-- ========================================================= -->
    <!-- ARROW MARKERS                                               -->
    <!-- ========================================================= -->

    <marker id="blue" markerWidth="9" markerHeight="9"
            refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/>
    </marker>

    <marker id="green" markerWidth="9" markerHeight="9"
            refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/>
    </marker>

    <marker id="orange" markerWidth="9" markerHeight="9"
            refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#ea580c"/>
    </marker>

    <marker id="red" markerWidth="9" markerHeight="9"
            refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#dc2626"/>
    </marker>

    <marker id="slate" markerWidth="9" markerHeight="9"
            refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>


    <!-- ========================================================= -->
    <!-- EMBEDDED AWS S3 LOGO (bucket)                               -->
    <!-- ========================================================= -->

    <symbol id="s3-logo"
            viewBox="0 0 32 32"
            preserveAspectRatio="xMidYMid meet">
      <path d="M29.758 1.168H2.242a.75.75 0 0 0-.75.75v13.672a.75.75 0 0 0 .75.75h27.516a.75.75 0 0 0 .75-.75V1.918a.75.75 0 0 0-.75-.75zM4.219 20.25H10.5v-8.625H4.219zM15.75 20.25h6.281v-8.625H15.75zM21.031 20.25h6.281v-8.625h-6.281zM4.219 11.625H10.5V3H4.219zM15.75 11.625h6.281V3H15.75zM21.031 11.625h6.281V3h-6.281z"
            fill="#f39c12"/>
      <path d="M16.5 20.25h-6.281v8.625h6.281zM21.781 20.25h-6.281v8.625h6.281zM27.062 20.25h-6.281v8.625h6.281z"
            fill="#f39c12" opacity="0.4"/>
    </symbol>


    <!-- ========================================================= -->
    <!-- EMBEDDED AWS EVENTBRIDGE LOGO                               -->
    <!-- ========================================================= -->

    <symbol id="eventbridge-logo"
            viewBox="0 0 32 32"
            preserveAspectRatio="xMidYMid meet">
      <path d="M16 2a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm-2.828 11.314L10.414 16l2.757-2.757 1.414 1.414L13.172 16l.999-1.414 1.414 1.414zM6.343 11.657l2.757 2.757 1.414-1.414L8.828 13l1.414-1.414 1.414 1.414L10.414 16l-2.757-2.757-1.414 1.414zM22.757 13l-1.414-1.414-1.414 1.414L20.414 16l2.757 2.757 1.414-1.414z"
            fill="#ffa500"/>
    </symbol>


    <!-- ========================================================= -->
    <!-- EMBEDDED AWS SQS LOGO (queue)                               -->
    <!-- ========================================================= -->

    <symbol id="sqs-logo"
            viewBox="0 0 32 32"
            preserveAspectRatio="xMidYMid meet">
      <path d="M8 4h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2 2h6v6h-6zM14 12h6v6h-6zM14 18h6v6h-6z"
            fill="#ff9900"/>
    </symbol>


    <!-- ========================================================= -->
    <!-- EMBEDDED AWS LAMBDA LOGO                                    -->
    <!-- ========================================================= -->

    <symbol id="lambda-logo"
            viewBox="0 0 32 32"
            preserveAspectRatio="xMidYMid meet">
      <path d="M16 2a14 14 0 1 0 0 28 14 14 0 0 0 0-28zm2.343 17.657-4.243-4.243 1.414-1.414L16 15.172l1.586-1.586 1.414 1.414zM8.243 8.243l4.243 4.243-1.414 1.414L8.243 11.657l-1.414 1.414zM23.757 23.757l-4.243-4.243 1.414-1.414L21 20.172l1.586-1.586 1.414 1.414z"
            fill="#f90"/>
    </symbol>

  </defs>

  <!-- ========================================================= -->
  <!-- BACKGROUND                                                  -->
  <!-- ========================================================= -->

  <rect width="1600" height="1100" fill="#ffffff"/>

  <!-- ========================================================= -->
  <!-- LAMBDA FUNCTION                                             -->
  <!-- ========================================================= -->

  <!-- Component card -->
  <g filter="url(#soft)">
    <rect x="64" y="440" width="382" height="172" rx="12"
          fill="#ffffff" stroke="#dbe5ef"/>
  </g>

  <!-- Icon -->
  <use href="#lambda-logo" x="110" y="466" width="44" height="44"/>

  <!-- Title -->
  <text x="170" y="482" font-size="16" font-weight="700" fill="#0f172a">
    Lambda Function
  </text>
  <text x="170" y="504" font-size="12.5" fill="#475569">
    omsl-s3-object-processor
  </text>

  <!-- Subtitle -->
  <text x="170" y="526" font-size="11.5" fill="#475569">
    Python 3.12 · event source mapping
  </text>

  <!-- Lambda details -->
  <rect x="170" y="540" width="260" height="54" rx="6" fill="#f1f5f9"/>
  <text x="184" y="560" font-size="10.5" fill="#64748b">
    OUTPUT_BUCKET=omsl-serverless-output
  </text>
  <text x="184" y="576" font-size="10.5" fill="#64748b">
    batchSize=5 · ReportBatchItemFailures
  </text>


  <!-- ========================================================= -->
  <!-- SQS DEAD-LETTER QUEUE                                       -->
  <!-- ========================================================= -->

  <!-- Component card -->
  <g filter="url(#soft)">
    <rect x="1056" y="440" width="382" height="172" rx="12"
          fill="#ffffff" stroke="#dbe5ef"/>
  </g>

  <!-- Icon -->
  <use href="#sqs-logo" x="1102" y="466" width="44" height="44"/>

  <!-- Title -->
  <text x="1162" y="482" font-size="16" font-weight="700" fill="#0f172a">
    SQS Dead-Letter Queue
  </text>
  <text x="1162" y="504" font-size="12.5" fill="#475569">
    omsl-serverless-dlq
  </text>

  <!-- Subtitle -->
  <text x="1162" y="526" font-size="11.5" fill="#475569">
    failed messages after 2 retries
  </text>

  <!-- DLQ stats hint -->
  <rect x="1162" y="540" width="260" height="54" rx="6" fill="#fee2e2"/>
  <text x="1176" y="560" font-size="10.5" fill="#991b1b">
    VisibilityTimeout 30s
  </text>
  <text x="1176" y="576" font-size="10.5" fill="#991b1b">
    manual inspection required
  </text>


  <!-- ========================================================= -->
  <!-- S3 OUTPUT BUCKET                                            -->
  <!-- ========================================================= -->

  <!-- Component card -->
  <g filter="url(#soft)">
    <rect x="560" y="440" width="382" height="172" rx="12"
          fill="#ffffff" stroke="#dbe5ef"/>
  </g>

  <!-- Icon -->
  <use href="#s3-logo" x="606" y="466" width="44" height="44"/>

  <!-- Title -->
  <text x="666" y="482" font-size="16" font-weight="700" fill="#0f172a">
    S3 Output Bucket
  </text>
  <text x="666" y="504" font-size="12.5" fill="#475569">
    omsl-serverless-output
  </text>

  <!-- Subtitle -->
  <text x="666" y="526" font-size="11.5" fill="#475569">
    processed/ prefix · result JSON
  </text>

  <!-- Output hint -->
  <rect x="666" y="540" width="260" height="54" rx="6" fill="#f1f5f9"/>
  <text x="680" y="560" font-size="10.5" fill="#64748b">
    processed/order-…result.json
  </text>
  <text x="680" y="576" font-size="10.5" fill="#64748b">
    status · source · payload
  </text>

  <!-- ========================================================= -->
  <!-- CONNECTIONS                                                 -->
  <!-- ========================================================= -->

  <!-- S3 Input → EventBridge (blue = publish / event) -->
  <path d="M446,286 H552"
        fill="none"
        stroke="#2563eb"
        stroke-width="2.6"
        marker-end="url(#blue)"/>
  <text x="496" y="278" font-size="11" fill="#334155" text-anchor="middle">
    PutObject
  </text>

  <!-- EventBridge → SQS Events (green = routing / binding) -->
  <path d="M942,286 H1048"
        fill="none"
        stroke="#16a34a"
        stroke-width="2.6"
        marker-end="url(#green)"/>
  <text x="992" y="278" font-size="11" fill="#334155" text-anchor="middle">
    put-targets
  </text>

  <!-- SQS Events → Lambda (orange = consume) -->
  <path d="M720,386 H132 V460 H156"
        fill="none"
        stroke="#ea580c"
        stroke-width="2.6"
        marker-end="url(#orange)"/>
  <text x="640" y="428" font-size="11" fill="#334155" text-anchor="middle">
    EventSourceMapping (poll)
  </text>

  <!-- Lambda → S3 Output (slate = write) -->
  <path d="M446,530 H552"
        fill="none"
        stroke="#475569"
        stroke-width="2.6"
        marker-end="url(#slate)"/>
  <text x="496" y="522" font-size="11" fill="#334155" text-anchor="middle">
    PutObject
  </text>

  <!-- Lambda → DLQ (red = dead-letter / nack) -->
  <path d="M446,530 H446 V580 H1048 V530"
        fill="none"
        stroke="#dc2626"
        stroke-width="2.6"
        marker-end="url(#red)"/>
  <text x="744" y="602" font-size="11" fill="#334155" text-anchor="middle">
    maxReceiveCount=2 → DLQ
  </text>

  <!-- ========================================================= -->
  <!-- LEGEND                                                      -->
  <!-- ========================================================= -->

  <text x="90" y="752" font-size="13" font-weight="700" fill="#475569">
    Legend
  </text>

  <path d="M90,782 H126"
        fill="none"
        stroke="#2563eb"
        stroke-width="2.6"
        marker-end="url(#blue)"/>
  <text x="136" y="786" font-size="12" fill="#334155">
    event / notification
  </text>

  <path d="M90,806 H126"
        fill="none"
        stroke="#16a34a"
        stroke-width="2.6"
        marker-end="url(#green)"/>
  <text x="136" y="810" font-size="12" fill="#334155">
    routing / binding
  </text>

  <path d="M90,830 H126"
        fill="none"
        stroke="#ea580c"
        stroke-width="2.6"
        marker-end="url(#orange)"/>
  <text x="136" y="834" font-size="12" fill="#334155">
    consume (poll)
  </text>

  <path d="M90,854 H126"
        fill="none"
        stroke="#dc2626"
        stroke-width="2.6"
        marker-end="url(#red)"/>
  <text x="136" y="858" font-size="12" fill="#334155">
    dead-letter (nack)
  </text>

  <path d="M90,878 H126"
        fill="none"
        stroke="#475569"
        stroke-width="2.4"
        marker-end="url(#slate)"/>
  <text x="136" y="882" font-size="12" fill="#334155">
    write to S3
  </text>


  <!-- ========================================================= -->
  <!-- WARNING                                                     -->
  <!-- ========================================================= -->

  <rect x="40" y="980" width="1520" height="86" rx="12"
        fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>

  <text x="800" y="1008" text-anchor="middle" font-size="18"
        font-weight="700" fill="#b45309">
    Educational playground — not production ready
  </text>

  <text x="800" y="1030" text-anchor="middle" font-size="13.5" fill="#92400e">
    LocalStack/FLOCI emulator · SQS event source mapping · Lambda runs in Docker
  </text>

</svg>
